          setBusinessInfo(form);

          showToast("Service availability updated.");
        };

      // --- AI Assistant Modal ---
      function AiAssistantModal({ onClose }) {
        const [messages, setMessages] = useState([
          { role: 'model', text: "Hello! I'm your Unique Travel AI guide. Tell me what kind of trip you're dreaming of (e.g. romantic weekend in Rome, family beach holiday in Bali), and I'll recommend the best options!" }
        ]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);

        const handleSend = async (e) => {
          e.preventDefault();
          if (!input.trim() || loading) return;

          const userMsg = input.trim();
          setInput('');
          setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
          setLoading(true);

          try {
            const systemPrompt = "You are a friendly, professional travel assistant for Unique Travel in Dublin, Ireland. Give concise, inspiring travel recommendations, suggest destinations like Paris, Rome, Dubai, Bangkok, Maldives, and prompt the user to get in touch with Unique Travel for custom bookings.";
            
            const payload = {
              contents: [{ parts: [{ text: userMsg }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();
            const reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "That sounds like an amazing journey! Let our travel specialists at Unique Travel in Dublin help you craft the perfect itinerary.";
            
            setMessages(prev => [...prev, { role: 'model', text: reply }]);
          } catch (err) {
            setMessages(prev => [...prev, { role: 'model', text: "That sounds like a wonderful travel idea! Get in touch with our Dublin team at Unique Travel to plan your bespoke itinerary." }]);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 bg-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-warmwhite w-full max-w-lg rounded-2xl shadow-2xl flex flex-col h-[500px] border border-gold/30">
              <div className="bg-navy text-warmwhite px-5 py-4 flex items-center justify-between rounded-t-2xl">
                <div className="flex items-center gap-2">
                  <i data-lucide="sparkles" className="w-5 h-5 text-turquoise"></i>
                  <h3 className="font-bold text-base">Unique Travel AI Assistant</h3>
                </div>
                <button onClick={onClose} className="text-warmwhite/70 hover:text-white">×</button>
              </div>

              <div className="flex-grow p-4 overflow-y-auto space-y-3 bg-warmwhite">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3 rounded-2xl text-xs sm:text-sm ${m.role === 'user' ? 'bg-turquoise text-warmwhite rounded-br-none' : 'bg-sand text-navy rounded-bl-none'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex justify-start">
                    <div className="bg-sand text-navy p-3 rounded-2xl text-xs animate-pulse">Thinking of ideal travel options...</div>
                  </div>
                )}
              </div>

              <form onSubmit={handleSend} className="p-3 border-t border-sand bg-white flex gap-2 rounded-b-2xl">
                <input 
                  type="text" 
                  value={input} 
                  onChange={e => setInput(e.target.value)}
                  placeholder="Ask for travel ideas..."
                  className="flex-grow p-2.5 rounded-xl border border-sand text-xs sm:text-sm focus:outline-none focus:border-turquoise"
                />
                <button type="submit" className="bg-navy text-warmwhite px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-navy/90">Send</button>
              </form>
            </div>
          </div>
        );
      }

                <h3 className="text-2xl font-bold text-navy">Enquiry Successfully Received</h3>
                <p className="text-sm text-navy/70 max-w-md mx-auto">
                  Thank you, {form.fullName}. Your request has been securely logged. A travel specialist from Unique Travel will review your requirements and contact you via {form.contactMethod}.
                </p>
                <button onClick={() => setSubmitted(false)} className="bg-navy text-warmwhite px-6 py-2.5 rounded-xl text-sm font-semibold">
                  Submit Another Enquiry
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="bg-white p-8 sm:p-10 rounded-2xl border border-sand shadow-sm space-y-8">
                {/* Personal Info */}
                <div className="space-y-4">
                  <h3 className="font-bold text-base text-navy border-b border-sand pb-2 flex items-center gap-2">
                    <i data-lucide="user" className="w-4 h-4 text-turquoise"></i> Personal Information
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Full Name *</label>
                      <input type="text" required placeholder="Jane Smith" value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Email Address *</label>
                      <input type="email" required placeholder="jane@example.com" value={form.email} onChange={e => setForm({...form, email: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Telephone Number *</label>
                      <input type="tel" required placeholder="+353 87 123 4567" value={form.telephone} onChange={e => setForm({...form, telephone: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Preferred Contact Method</label>
                      <select value={form.contactMethod} onChange={e => setForm({...form, contactMethod: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm">
                        <option>Email</option>
                        <option>Phone Call</option>
                        <option>WhatsApp</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Travel Info */}
                <div className="space-y-4">
                  <h3 className="font-bold text-base text-navy border-b border-sand pb-2 flex items-center gap-2">
                    <i data-lucide="compass" className="w-4 h-4 text-turquoise"></i> Travel Details
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Departure Location *</label>
                      <input type="text" required placeholder="e.g. Dublin" value={form.departure} onChange={e => setForm({...form, departure: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Destination *</label>
                      <input type="text" required placeholder="e.g. Rome, Italy" value={form.destination} onChange={e => setForm({...form, destination: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Departure Date *</label>
                      <input type="date" required value={form.depDate} onChange={e => setForm({...form, depDate: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Return Date</label>
                      <input type="date" value={form.retDate} onChange={e => setForm({...form, retDate: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Number of Travellers</label>
                      <input type="number" min="1" value={form.travellers} onChange={e => setForm({...form, travellers: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase mb-1">Estimated Budget</label>
                      <select value={form.budget} onChange={e => setForm({...form, budget: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm">
                        <option>Budget (&lt; €1,000)</option>
                        <option>Moderate (€1,000 - €3,000)</option>
                        <option>Luxury (€3,000 - €6,000)</option>
                        <option>Ultra Luxury (€6,000+)</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase mb-1">Travel Type</label>
                    <select value={form.travelType} onChange={e => setForm({...form, travelType: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm">
                      <option>Holiday Package</option>
                      <option>Flight Booking</option>
                      <option>Tailor-Made Itinerary</option>
                      <option>Hotel Reservation</option>
                      <option>Family / Group Trip</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase mb-1">Additional Requests & Details</label>
                    <textarea rows="4" placeholder="Tell us about special occasions, accommodation preferences, dietary needs, or activity interests..." value={form.additionalRequests} onChange={e => setForm({...form, additionalRequests: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm"></textarea>
                  </div>
                </div>

                {/* Consents */}
                <div className="space-y-3 pt-2">
                  <div className="flex items-start gap-2">
                    <input type="checkbox" required checked={form.privacyAgreed} onChange={e => setForm({...form, privacyAgreed: e.target.checked})} id="privacy" className="mt-1 rounded text-turquoise" />
                    <label htmlFor="privacy" className="text-xs text-navy/80">
                      I acknowledge the processing of my personal data in accordance with the Unique Travel Privacy Policy. *
                    </label>
                  </div>
                  <div className="flex items-start gap-2">
                    <input type="checkbox" checked={form.marketingConsent} onChange={e => setForm({...form, marketingConsent: e.target.checked})} id="marketing" className="mt-1 rounded text-turquoise" />
                    <label htmlFor="marketing" className="text-xs text-navy/80">
                      Optional: I would like to receive occasional travel inspiration and special offers from Unique Travel.
                    </label>
                  </div>
                </div>

                <div className="pt-4">
                  <button type="submit" className="w-full bg-navy text-warmwhite py-3.5 rounded-xl font-bold text-sm shadow hover:bg-navy/90 transition">
                    Submit Travel Enquiry
                  </button>
                </div>
              </form>
            )}
          </div>
        );
      }

      // --- 8. Contact Us Page ---
      function ContactPage({ businessInfo, showToast, addEnquiry }) {
        const [msgForm, setMsgForm] = useState({ name: '', email: '', message: '' });

        const handleMsgSubmit = (e) => {
          e.preventDefault();
          addEnquiry({ type: 'Contact Form Message', ...msgForm });
          showToast("Message sent to Unique Travel Dublin office!");
          setMsgForm({ name: '', email: '', message: '' });
        };

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
            <div className="text-center space-y-2 max-w-2xl mx-auto">
              <span className="text-turquoise text-xs font-semibold uppercase tracking-widest">Get In Touch</span>
              <h1 className="text-3xl sm:text-4xl font-extrabold text-navy">Contact Unique Travel</h1>
              <p className="text-sm text-navy/70">
                We are based in Dublin, Ireland. Reach out via phone, email, or drop by our office to discuss your travel plans.
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
              {/* Info & Details */}
              <div className="bg-white p-8 rounded-2xl border border-sand shadow-sm space-y-8">
                <div>
                  <h3 className="font-bold text-xl text-navy mb-4">Dublin Headquarters</h3>
                  <div className="space-y-4 text-sm text-navy/80">
                    <div className="flex items-start gap-3">
                      <i data-lucide="map-pin" className="w-5 h-5 text-turquoise shrink-0 mt-0.5"></i>
                      <span>{businessInfo.address}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <i data-lucide="phone" className="w-5 h-5 text-turquoise shrink-0"></i>
                      <a href={`tel:${businessInfo.phone}`} className="hover:text-turquoise">{businessInfo.phone}</a>
                    </div>
                    <div className="flex items-center gap-3">
                      <i data-lucide="mail" className="w-5 h-5 text-turquoise shrink-0"></i>
                      <a href={`mailto:${businessInfo.email}`} className="hover:text-turquoise">{businessInfo.email}</a>
                    </div>
                    <div className="flex items-start gap-3">
                      <i data-lucide="clock" className="w-5 h-5 text-turquoise shrink-0 mt-0.5"></i>
                      <span>{businessInfo.hours}</span>
                    </div>
                  </div>
                </div>

                <div className="pt-4 border-t border-sand">
                  <h4 className="font-bold text-sm text-navy mb-3">Google Maps Location Reference</h4>
                  <p className="text-xs text-navy/70 mb-4">
                    Our office is conveniently located in central Dublin. You can verify our exact premises and directions via Google Maps:
                  </p>
                  <a 
                    href="https://www.google.com/maps/place/Unique+Travel/@53.3493597,-6.2694285,17z/" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-2 bg-sand/50 hover:bg-sand text-navy px-4 py-2.5 rounded-xl text-xs font-semibold transition border border-sand"
                  >
                    <i data-lucide="map" className="w-4 h-4 text-turquoise"></i>
                    View on Google Maps
                  </a>
                </div>
              </div>

              {/* Contact Form */}
              <div className="bg-white p-8 rounded-2xl border border-sand shadow-sm space-y-6">
                <h3 className="font-bold text-xl text-navy">Send Us a Message</h3>
                <form onSubmit={handleMsgSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase mb-1">Your Name *</label>
                    <input type="text" required placeholder="Alex Murphy" value={msgForm.name} onChange={e => setMsgForm({...msgForm, name: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase mb-1">Email Address *</label>
                    <input type="email" required placeholder="alex@example.com" value={msgForm.email} onChange={e => setMsgForm({...msgForm, email: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase mb-1">Message *</label>
                    <textarea rows="4" required placeholder="How can our Dublin team assist you today?" value={msgForm.message} onChange={e => setMsgForm({...msgForm, message: e.target.value})} className="w-full p-3 rounded-xl border border-sand bg-warmwhite text-sm"></textarea>
                  </div>
                  <button type="submit" className="w-full bg-navy text-warmwhite py-3 rounded-xl font-bold text-sm shadow hover:bg-navy/90 transition">
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // --- 9. Privacy Policy Page ---
      function PrivacyPage() {
        return (
          <div className="max-w-4xl mx-auto px-4 py-12 space-y-8 text-sm text-navy/80 leading-relaxed">
            <h1 className="text-3xl font-extrabold text-navy">Privacy Policy</h1>
            <p className="text-xs text-navy/60">Last updated: January 2026</p>
            
            <div className="bg-white p-8 rounded-2xl border border-sand space-y-4">
              <h3 className="font-bold text-base text-navy">1. Introduction</h3>
              <p>Unique Travel ("we", "our", "us"), based in Dublin, Ireland, respects your privacy and is committed to protecting your personal data. This privacy policy informs you how we look after your personal data when you visit our website or submit travel enquiries.</p>

              <h3 className="font-bold text-base text-navy pt-2">2. Data We Collect</h3>
              <p>We may collect, use, store and transfer different kinds of personal data about you when you fill out our flight or holiday enquiry forms, including identity data (name), contact data (email address, telephone number), and travel preference details.</p>

              <h3 className="font-bold text-base text-navy pt-2">3. How We Use Your Data</h3>
              <p>We use your personal data solely to respond to your travel enquiries, prepare customised holiday itineraries or flight options, and communicate with you regarding your requested travel arrangements.</p>

              <h3 className="font-bold text-base text-navy pt-2">4. Data Security</h3>
              <p>We have put in place appropriate security measures to prevent your personal data from being accidentally lost, used, or accessed in an unauthorised way.</p>

              <h3 className="font-bold text-base text-navy pt-2">5. Contact Us</h3>
              <p>If you have any questions about this privacy policy, please contact our Dublin office via enquiries@uniquetravel.ie.</p>
            </div>
          </div>
        );
      }

      // --- 10. Terms and Conditions Page ---
      function TermsPage() {
        return (
          <div className="max-w-4xl mx-auto px-4 py-12 space-y-8 text-sm text-navy/80 leading-relaxed">
            <h1 className="text-3xl font-extrabold text-navy">Terms and Conditions</h1>
            <p className="text-xs text-navy/60">Last updated: January 2026</p>

            <div className="bg-white p-8 rounded-2xl border border-sand space-y-4">
              <h3 className="font-bold text-base text-navy">1. Agency Role</h3>
              <p>Unique Travel operates as an independent travel agency based in Dublin, Ireland. We assist customers in discovering travel services, exploring destinations, and submitting enquiries for flights and holidays.</p>

              <h3 className="font-bold text-base text-navy pt-2">2. Enquiries and Bookings</h3>
              <p>Submitting an enquiry through our website constitutes a request for travel planning and quotation. No ticket or reservation is purchased or confirmed until direct confirmation and payment terms are finalised with our agency staff.</p>

              <h3 className="font-bold text-base text-navy pt-2">3. Prices and Availability</h3>
              <p>Sample prices and package descriptions displayed on this website are illustrative. Live pricing, availability, and applicable conditions are confirmed upon direct consultation with Unique Travel.</p>

              <h3 className="font-bold text-base text-navy pt-2">4. Deposits and Payments</h3>
              <p>Where deposits and instalments are applicable to confirmed bespoke bookings, payment deadlines, cancellation terms, and refund policies will be provided in writing by our agency.</p>

              <h3 className="font-bold text-base text-navy pt-2">5. Governing Law</h3>
              <p>These terms and conditions are governed by and construed in accordance with the laws of Ireland, and any disputes shall be subject to the exclusive jurisdiction of the Irish courts.</p>
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
